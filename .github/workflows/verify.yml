name: Verify Landsat replay

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MoonBit 1.0.0-rc1
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '1.0.0-rc1+3c0520448'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check compiler and build the JavaScript CLI
        run: |
          compiler="$(moonc -v)"
          printf '%s\n' "$compiler"
          test "${compiler%% *}" = 'v1.0.0-rc1+3c0520448'
          moon check --target js
          moon build --release --target js
      - name: Verify clean build and both real Landsat cases
        run: python scripts/verify_local.py
      - name: Verify the public library on Native
        run: moon test review --target native
      - name: Verify the public library on Wasm GC
        run: moon test review --target wasm-gc
      - name: Verify threshold sweep, QA pairing and tile CLI
        run: python scripts/verify_analysis.py
      - name: Verify the spatial stress test and GDAL export on three real sites
        run: |
          python -m pip install rasterio
          python scripts/verify_shift_stress.py --geotiff
      - uses: actions/upload-artifact@v4
        with:
          name: gridproof-reports
          if-no-files-found: error
          path: |
            gezheng.js
            格证-实测报告.html
            格证-肥东对照报告.html
            results/summary.json
            results/feidong/summary.json
